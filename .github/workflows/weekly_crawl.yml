name: Weekly Price Crawl

on:
  schedule:
    - cron: '0 6 * * 0' # Every Sunday at 6:00 AM UTC
  workflow_dispatch: # Allows manual trigger

jobs:
  crawl:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Needed to push back to the repo

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .

      - name: Run King Kullen API Crawler
        run: |
          # The crawler will use its default output: data/snapshots/YYYY-MM-DD.jsonl
          python -m grocery_pricing.api_crawler

      - name: Commit and push results
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add data/snapshots/*.jsonl
          # Only commit if there are changes
          if git diff --staged --quiet; then
            echo "No new price data found."
          else
            git commit -m "chore: weekly price snapshot $(date +%F)"
            git push
          fi
