name: Weekly Price Crawl

on:
  schedule:
    - cron: '0 6 * * 0' # Every Sunday at 6:00 AM UTC
  workflow_dispatch: # Allows manual trigger

jobs:
  crawl:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Needed to push back to the repo

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .

      - name: Run King Kullen API Crawler
        run: |
          python -m grocery_pricing.api_crawler --minimum-items 10000

      - name: Compare with prior week and publish report
        run: |
          python -m grocery_pricing.weekly_report --markdown weekly-summary.md
          cat weekly-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Run verification
        run: python -m unittest

      - name: Commit snapshot and analysis
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add data/snapshots/*.jsonl docs/index.html docs/weekly-report.html docs/catalog-history.html docs/assets/catalog-history.css docs/assets/catalog-history.js docs/data/weekly-summary.json docs/data/catalog-history
          # Only commit if there are changes
          if git diff --staged --quiet; then
            echo "No new price data or analysis found."
          else
            git commit -m "data: weekly snapshot and price analysis $(date +%F)"
            git push
          fi
